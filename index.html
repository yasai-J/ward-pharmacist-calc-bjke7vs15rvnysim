<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>病棟薬剤師用 医学電卓</title>
<!-- 検索エンジンに載せない -->
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eef3f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1520" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="医学電卓">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* 病棟薬剤師用 医学電卓：ホーム → カテゴリー → 計算画面。結果は画面下に常時表示 */
:root{
  --bg:#eef3f9;--panel:#ffffff;--sunk:#f4f7fb;--ink:#14243a;--muted:#5b6b80;--line:#d5deea;
  --accent:#3470b8;--accent-ink:#ffffff;--accent-soft:#e2ecf8;
  --ok:#256f40;--ok-bg:#e1f1e6;--warn:#8f5a0c;--warn-bg:#fbeed6;--bad:#ad2219;--bad-bg:#fbe2de;--info:#2a5a86;--info-bg:#e1ebf5;
  --hm0:#bfe1c6;--hm1:#f3e29a;--hm2:#f1bd85;--hm3:#e99a90;--dock:#1d3a63;--dock-ink:#f2f6fb;
  --f-ui:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo','Noto Sans JP',system-ui,sans-serif;
  --f-num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520;--panel:#172131;--sunk:#121b28;--ink:#e3e9f2;--muted:#95a3b6;--line:#2a3648;
  --accent:#7aaae6;--accent-ink:#0b1a2e;--accent-soft:#1c2d45;
  --ok:#6ccb8d;--ok-bg:#183424;--warn:#e6b052;--warn-bg:#3a2c12;--bad:#f2786a;--bad-bg:#3e1d19;--info:#86b6e2;--info-bg:#18293a;
  --hm0:#24563a;--hm1:#6b5d1c;--hm2:#7a4a1f;--hm3:#7c2c25;--dock:#dce6f3;--dock-ink:#0e1520;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520;--panel:#172131;--sunk:#121b28;--ink:#e3e9f2;--muted:#95a3b6;--line:#2a3648;
  --accent:#7aaae6;--accent-ink:#0b1a2e;--accent-soft:#1c2d45;
  --ok:#6ccb8d;--ok-bg:#183424;--warn:#e6b052;--warn-bg:#3a2c12;--bad:#f2786a;--bad-bg:#3e1d19;--info:#86b6e2;--info-bg:#18293a;
  --hm0:#24563a;--hm1:#6b5d1c;--hm2:#7a4a1f;--hm3:#7c2c25;--dock:#dce6f3;--dock-ink:#0e1520;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin-inline:auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:6px;min-height:56px;border-bottom:1px solid var(--line)}
.bar h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;font-size:1.5rem;color:var(--ink);flex:none;margin-left:-8px}
.icon-btn:active{background:var(--accent-soft)}
.star{color:var(--muted);font-size:1.3rem;margin-left:0;margin-right:-8px}
.star.on{color:#d39b12}
.app-ic{width:36px;height:36px;border-radius:9px;flex:none}
.sec-row{display:flex;align-items:center;justify-content:space-between}
.mini-clear{border:0;background:none;color:var(--muted);font-size:.72rem;padding:4px 6px;border-radius:6px;margin:14px -6px 0 0}
.mini-clear:active{background:var(--accent-soft)}
.hello{display:flex;align-items:center;gap:10px;padding-block:18px 12px}
.hello b{font-size:1.15rem;line-height:1.3}
.hello small{color:var(--muted);font-size:.75rem;margin-left:auto}
.search{width:100%;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:1rem}
.sec-t{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:22px 0 8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-size:.88rem;white-space:nowrap}
.qchip:active{background:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;text-align:left;min-height:112px;min-width:0}
.tile:active{background:var(--accent-soft);border-color:var(--accent)}
.tile .ico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.tile .ico svg.ic{width:26px;height:26px}
.tile .tn{font-weight:700;font-size:1rem;line-height:1.3}
.tile .ts{font-size:.75rem;color:var(--muted);line-height:1.4}
.tile.sm{min-height:96px;padding:12px;gap:6px}
.tile.sm .ico{width:34px;height:34px;border-radius:10px}
.tile.sm .ico svg.ic{width:20px;height:20px}
.tile.sm .tn{font-size:.92rem;font-weight:600;word-break:break-word}
.sub{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
.sub svg.ic{width:16px;height:16px}
.foot{font-size:.75rem;color:var(--muted);margin-top:24px;line-height:1.7}
.desc{color:var(--muted);font-size:.88rem;margin:12px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:12px}
.clear-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 12px;font-size:.8rem;letter-spacing:0;color:var(--ink)}
.clear-btn svg.ic{width:16px;height:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-size:.8rem;color:var(--muted)}
.grp{grid-column:1/-1;font-size:.82rem;font-weight:700;color:var(--accent);border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;align-items:center;gap:8px}
.grp small{font-weight:400;color:var(--muted);font-size:.75rem}
.grp:first-child{border-top:0;padding-top:0;margin-top:0}
.inwrap{display:flex;align-items:center;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);overflow:hidden}
.inwrap:focus-within{border-color:var(--accent)}
.inwrap input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 12px;font-family:var(--f-num);font-size:1.1rem;font-variant-numeric:tabular-nums}
.inwrap input::placeholder{color:var(--muted);opacity:.45}
.inwrap input:focus{outline:none}
.inwrap input::-webkit-outer-spin-button,.inwrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inwrap input[type=number]{-moz-appearance:textfield;appearance:textfield}
.inwrap span{padding-right:12px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.fld select{height:48px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;width:100%;min-width:0;font-size:.95rem}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:8px;min-height:40px;font-size:.88rem;padding:4px 6px;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.opt{display:flex;align-items:center;gap:10px;border:0;background:var(--panel);text-align:left;padding:11px 12px;min-height:48px;font-size:.9rem;line-height:1.4}
.opt+.opt{border-top:1px solid var(--line)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"]{background:var(--accent-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt .box{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .box::after{content:"✓"}
.opt .pts{margin-left:auto;font-family:var(--f-num);font-size:.8rem;color:var(--muted);white-space:nowrap;padding-left:8px}
.opt .stag{margin-left:auto;font-size:.65rem;color:var(--muted);white-space:nowrap;padding-left:8px;text-align:right;line-height:1.3}
.opt[aria-pressed="true"] .pts{color:var(--accent);font-weight:600}
.mains{display:flex;flex-direction:column;gap:12px}
.mn .lab{font-size:.8rem;color:var(--muted)}
.mn .val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn .num{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;word-break:break-word}
.mn.sm .num{font-size:1.4rem}
.mn .unit{color:var(--muted);font-size:.85rem}
.chip{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.lv-ok{background:var(--ok-bg);color:var(--ok)}.lv-warn{background:var(--warn-bg);color:var(--warn)}.lv-bad{background:var(--bad-bg);color:var(--bad)}.lv-info{background:var(--info-bg);color:var(--info)}
.rows{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:12px}
.rows td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.rows td:nth-child(2){text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;padding-left:10px}
.rows td:nth-child(3){color:var(--muted);font-size:.75rem;padding-left:6px;white-space:nowrap;width:1%}
.msg{margin-top:12px;font-size:.88rem;line-height:1.7;background:var(--sunk);border-radius:10px;padding:10px 12px}
.msg ul{margin:4px 0;padding-left:1.2em}
.empty{color:var(--muted);font-size:.9rem;margin:0}
details.more{border-top:1px solid var(--line);margin-top:12px}
details.more summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"＋"}
details.more[open] summary::after{content:"－"}
.formula{font-family:var(--f-num);font-size:.8rem;line-height:1.8;white-space:pre-wrap;padding-bottom:12px}
.expl{font-size:.85rem;line-height:1.7;padding-bottom:12px}
.expl p{margin:0 0 8px}
.expl ul{margin:0 0 8px;padding-left:1.2em}
.note{font-size:.78rem;color:var(--muted);margin:0 0 12px}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
.info-tbl{border-collapse:collapse;width:100%;font-size:.84rem;min-width:420px}
.info-tbl th,.info-tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.info-tbl th{background:var(--sunk);font-weight:600;font-size:.78rem}
.hm{border-collapse:separate;border-spacing:3px;font-size:.78rem;margin-top:12px;font-family:var(--f-num)}
.hm td,.hm th{width:52px;height:28px;text-align:center;border-radius:4px}
.hm th{color:var(--muted);font-weight:500}
.hm .r0{background:var(--hm0)}.hm .r1{background:var(--hm1)}.hm .r2{background:var(--hm2)}.hm .r3{background:var(--hm3)}
.hm .here{outline:3px solid var(--ink);outline-offset:-3px;font-weight:700}
.mix-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 44px;gap:8px;margin-bottom:8px}
.mix-row select{height:48px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 8px;min-width:0;font-size:.9rem}
.mix-row .del,.add{border:1px solid var(--line);background:var(--sunk);border-radius:10px;height:48px}
.add{width:100%;font-size:.9rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--dock);color:var(--dock-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border:0;width:100%;text-align:left;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.dock-in{max-width:680px;margin-inline:auto;display:flex;align-items:center;gap:12px;width:100%}
.dock .dl{font-size:.72rem;opacity:.75;display:block}
.dock .dv{font-family:var(--f-num);font-size:1.3rem;font-weight:600;line-height:1.2}
.dock .du{font-size:.75rem;opacity:.75;margin-left:4px}
.dock .chip{margin-left:auto}
@media (min-width:720px){.mn .num{font-size:2.3rem}.tiles.cats{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

CALC.dapt={name:'DAPT期間（PRECISE-DAPT・DAPT score）',sub:'抗血小板薬2剤併用の期間',desc:'PCI時の「短くするか」と、1年後の「延ばすか」を1ページで評価。',

 const pd=cl((100/5.52784356)*(0.02595618*(a-50)-0.0140439*(c-100)-0.40551264*(h-12)+0.05697497*(w-5)+(v.pd_bl?1.41955653:0)),0,100);
 const dage=v.age>=75?-2:v.age>=65?-1:0;let ds=dage;['da_smk','da_dm','da_mi','da_pci','da_pes','da_3mm'].forEach(k=>{if(v[k])ds+=1});if(v.da_hf)ds+=2;if(v.da_svg)ds+=2;

 sections:[['2つのスコアの違い',EXPL(['<b>PRECISE-DAPT</b>：PCI直後に使う。出血リスクだけを評価し、25点以上ならDAPTを短期間（3–6か月）にすることを検討。「短くするか」の判断。','<b>DAPT score</b>：PCIから1年間、イベントなくDAPTを続けられた患者に使う。虚血と出血の両方を見て、12か月を超えて延長するかを判断。「延ばすか」の判断。','国内のJCSガイドラインは、高出血リスクの判定にARC-HBR（日本版はJ-HBR）を用いる。'])],

CALC.qt={name:'QTc判定・TdPリスク',sub:'QT延長・不整脈の注意',desc:'電子カルテのQTc値で判定し、TdPの危険因子を確認。',inputs:[N('qtcv','QTc','ms',478),SEX,N('qtcb','ベースラインQTc（任意）','ms',440,{opt:true}),H('TdPの危険因子'),...TDP],

function catHTML(ci){const c=CATS[ci];return'<div class="bar"><button type="button" class="icon-btn" data-back aria-label="戻る">‹</button><h1>'+c.n+'</h1></div>'+c.subs.map(s=>'<div class="sub">'+icon(s[1])+s[0]+'</div><div class="tiles">'+s[2].map(tileItem).join('')+'</div>').join('')}
function getV(i){return S[i.id]!==undefined?S[i.id]:(i.t==='n'?'':i.t==='c'?false:i.def)}
function optsOf(i,v){return typeof i.opts==='function'?i.opts(v):i.opts}
function rawVals(def){const v={};def.inputs.forEach(i=>{if(i.t==='h')return;let x=getV(i);if(i.t==='s'){const o=optsOf(i,v);if(!o.some(p=>p[0]===x))x=o[0]&&o[0][0]}v[i.id]=i.t==='n'?num(x):i.t==='c'?!!x:x});return v}
function fieldHTML(i,v,def){
 if(i.t==='h')return'<div class="grp">'+i.label+(i.small?'<small>'+i.small+'</small>':'')+'</div>';
 if(i.t==='n'){const val=getV(i);return'<div class="fld'+(i.full?' full':'')+'"><label for="f_'+i.id+'">'+i.label+'</label><div class="inwrap"><input id="f_'+i.id+'" data-k="'+i.id+'" type="number" inputmode="decimal" step="'+(i.step||'any')+'" value="'+esc(val)+'"'+(i.ex!==undefined?' placeholder="例 '+i.ex+'"':'')+'>'+(i.unit?'<span>'+i.unit+'</span>':'')+'</div></div>'}
 if(i.t==='s'){const o=optsOf(i,v),val=v[i.id];
  if(i.score||i.list)return'<div class="fld full"><span class="lbl">'+i.label+'</span><div class="rlist" role="radiogroup">'+o.map(p=>'<button type="button" class="opt" role="radio" aria-pressed="'+(p[0]===val)+'" aria-checked="'+(p[0]===val)+'" data-k="'+i.id+'" data-v="'+p[0]+'"><span class="dot"></span><span>'+p[1]+'</span>'+(i.score?'<span class="pts">'+(parseFloat(p[0])>0?'+':'')+p[0]+'</span>':'')+'</button>').join('')+'</div></div>';
  const short=o.length<=5&&o.every(p=>p[1].length<=(o.length<=2?14:o.length===3?9:6));
  if(short)return'<div class="fld'+(i.full||o.length>2?' full':'')+'"><span class="lbl">'+i.label+'</span><div class="seg" role="radiogroup">'+o.map(p=>'<button type="button" role="radio" aria-pressed="'+(p[0]===val)+'" aria-checked="'+(p[0]===val)+'" data-k="'+i.id+'" data-v="'+p[0]+'">'+p[1]+'</button>').join('')+'</div></div>';
  return'<div class="fld full"><label for="f_'+i.id+'">'+i.label+'</label><select id="f_'+i.id+'" data-k="'+i.id+'">'+o.map(p=>'<option value="'+p[0]+'"'+(p[0]===val?' selected':'')+'>'+p[1]+'</option>').join('')+'</select></div>'}
 if(i.t==='c')return'<button type="button" class="opt" role="checkbox" aria-pressed="'+!!v[i.id]+'" aria-checked="'+!!v[i.id]+'" data-k="'+i.id+'" data-c="1"><span class="box"></span><span>'+i.label+'</span>'+(i.tag?'<span class="stag">'+i.tag+'</span>':def.isScore&&i.pts?'<span class="pts">+'+i.pts+'</span>':'')+'</button>';return''}
function fieldsHTML(def){const v=rawVals(def);let h='',buf='';const flush=()=>{if(buf){h+='<div class="fld full"><div class="rlist">'+buf+'</div></div>';buf=''}};
 def.inputs.forEach(i=>{if(i.show&&!i.show(v))return;if(i.t==='c'){buf+=fieldHTML(i,v,def);return}flush();h+=fieldHTML(i,v,def)});flush();return h}
const LVT={ok:'基準内',warn:'注意',bad:'要対応',info:'参考'};
function compute(def){const v=rawVals(def);const miss=def.inputs.some(i=>i.t==='n'&&!i.opt&&(!i.show||i.show(v))&&!isFinite(v[i.id]));if(miss)return null;try{return def.compute(v,def)}catch(e){return null}}
function mainHTML(m,sm){return'<div class="mn'+(sm?' sm':'')+'"><div class="lab">'+m[0]+'</div><div class="val"><span class="num">'+m[1]+'</span><span class="unit">'+(m[2]||'')+'</span>'+(m[3]?'<span class="chip lv-'+m[3]+'">'+(m[4]||LVT[m[3]])+'</span>':'')+'</div></div>'}
function resultHTML(r){if(!r)return'<p class="empty">必要な項目を入力すると結果を表示します。</p>';const ms=Array.isArray(r.main[0])?r.main:[r.main];
 let h='<div class="mains">'+ms.map((m,i)=>mainHTML(m,i>0)).join('')+'</div>';
 if(r.rows&&r.rows.length)h+='<table class="rows">'+r.rows.map(x=>'<tr><td>'+x[0]+'</td><td>'+(x[3]&&x[3]!=='ok'?'<span class="chip lv-'+x[3]+'">'+x[1]+'</span>':x[1])+'</td><td>'+(x[2]||'')+'</td></tr>').join('')+'</table>';
 if(r.extra)h+=r.extra;if(r.msg)h+='<div class="msg">'+r.msg+'</div>';if(r.after)h+=r.after;return h}
function dock(r){if(!r){$('#dock-in').innerHTML='<span><span class="dl">結果</span><span class="dv" style="font-size:1rem">入力待ち</span></span>';return}const m=Array.isArray(r.main[0])?r.main[0]:r.main;
 $('#dock-in').innerHTML='<span style="min-width:0"><span class="dl">'+m[0]+'</span><span class="dv">'+m[1]+'</span><span class="du">'+(m[2]||'')+'</span></span>'+(m[3]?'<span class="chip lv-'+m[3]+'">'+(m[4]||LVT[m[3]])+'</span>':'')}
function update(){const r=compute(CALC[view.id]);$('#res').innerHTML=resultHTML(r);dock(r)}
function calcHTML(id){const d=CALC[id],fav=FAV.includes(id);let h='<div class="bar"><button type="button" class="icon-btn" data-back aria-label="戻る">‹</button><h1>'+esc(d.name)+'</h1><button type="button" class="icon-btn star'+(fav?' on':'')+'" data-fav aria-label="よく使う">'+(fav?'★':'☆')+'</button></div><p class="desc">'+d.desc+'</p>';
 if(d.custom)return h+'<section class="card"><div class="card-h">混合する輸液<button type="button" class="clear-btn" id="mixclr">'+icon('clear')+'クリア</button></div><div id="mixrows"></div><button type="button" class="add" id="mixadd">＋ 輸液を追加</button></section><section class="card" id="res-card"><div class="card-h">混合後</div><div id="res"></div><details class="more"><summary>計算式</summary>'+FORM('最終濃度 = Σ(濃度 × 液量) / 総液量\n理論浸透圧 ≒ Na + K + Cl + 乳酸/酢酸 + Ca/2 + ブドウ糖(mmol/L)\n浸透圧比 = 理論浸透圧 / 285')+'</details></section><p class="note">組成は代表的な製剤の値。採用製剤で確認。</p>';
 return h+'<section class="card"><div class="card-h">入力<button type="button" class="clear-btn" data-clear>'+icon('clear')+'クリア</button></div><div class="fields" id="fields">'+fieldsHTML(d)+'</div></section><section class="card" id="res-card"><div class="card-h">結果</div><div id="res"></div>'+
  (d.sections||[]).map(s=>'<details class="more"'+(s[2]?' open':'')+'><summary>'+s[0]+'</summary>'+s[1]+'</details>').join('')+'</section>'+(d.note?'<p class="note">'+d.note+'</p>':'')}
function render(){const app=$('#app'),dk=$('#dock');dk.hidden=view.t!=='calc';
 if(view.t==='home'){app.innerHTML=homeHTML();return}if(view.t==='cat'){app.innerHTML=catHTML(view.ci);return}
 app.innerHTML=calcHTML(view.id);if(CALC[view.id].custom)bindMix();else update()}
function refreshFields(){$('#fields').innerHTML=fieldsHTML(CALC[view.id]);update()}
function bindMix(){const opts=Object.entries(MIXP).map(([k,x])=>'<option value="'+k+'">'+x[0]+'</option>').join('');
 const draw=()=>{$('#mixrows').innerHTML=MIX.map((r,i)=>'<div class="mix-row"><select data-i="'+i+'" data-f="p" aria-label="輸液">'+opts.replace('value="'+r.p+'"','value="'+r.p+'" selected')+'</select><div class="inwrap"><input type="number" inputmode="decimal" data-i="'+i+'" data-f="v" value="'+esc(r.v)+'" placeholder="例 '+(i?20:500)+'" aria-label="液量"><span>mL</span></div><button type="button" class="del" data-del="'+i+'" aria-label="削除">×</button></div>').join('');calc()};
 const calc=()=>{let V=0,t=[0,0,0,0,0,0];MIX.forEach(r=>{const p=MIXP[r.p],vl=num(r.v)||0;V+=vl;for(let j=0;j<6;j++)t[j]+=p[j+1]*vl});if(!V){$('#res').innerHTML='<p class="empty">液量を入力してください。</p>';dock(null);return}
  const[na,k,cl,ca,b,g]=t.map(x=>x/V),osm=na+k+cl+b+ca/2+g/180*1000,ratio=osm/285;
  const r={main:[['K濃度',f(k,1),'mEq/L',k>40?'bad':'ok',k>40?'40超':'≤40'],['理論浸透圧',f(osm,0),'mOsm/L',ratio>3?'bad':ratio>1.5?'warn':'ok','浸透圧比 '+f(ratio,2)]],rows:[['総液量',f(V,0),'mL'],['Na',f(na,1),'mEq/L'],['Cl',f(cl,1),'mEq/L'],['ブドウ糖',f(g/10,2),'%']],msg:(k>40?'K濃度が 40 mEq/L を超えている（KCl注の上限）。':'')+(ratio>3?' 浸透圧比 3 超は末梢静脈投与に不向き。':'')};
  $('#res').innerHTML=resultHTML(r);dock(r)};
 draw();const box=$('#mixrows');const set=e=>{const i=e.target.dataset.i;if(i===undefined)return;MIX[i][e.target.dataset.f]=e.target.value;calc()};box.addEventListener('input',set);box.addEventListener('change',set);
 box.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;MIX.splice(+b.dataset.del,1);draw()});$('#mixadd').onclick=()=>{MIX.push({p:'ns',v:''});draw()};$('#mixclr').onclick=()=>{MIX=[{p:'t3',v:''},{p:'kcl',v:''}];draw()}}
const stack=[];
function hashOf(v){return v.t==='calc'?v.id:v.t==='cat'?'cat'+v.ci:''}
function nav(v,push=true){if(push)stack.push(view);view=v;if(v.t==='calc'){REC=[v.id,...REC.filter(x=>x!==v.id)].slice(0,10);store.set('mc_rec',REC)}try{history.replaceState(null,'',hashOf(v)?'#'+hashOf(v):location.pathname+location.search)}catch(e){}render();window.scrollTo(0,0)}
function back(){let p=stack.pop();if(!p){const so=view.t==='calc'?subOf(view.id):null;p=so?{t:'cat',ci:so.ci}:{t:'home'}}nav(p,false)}
$('#app').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-recclear')){REC=[];store.set('mc_rec',REC);render();return}
 if(t.dataset.go){nav({t:'calc',id:t.dataset.go});return}if(t.dataset.cat!==undefined){nav({t:'cat',ci:+t.dataset.cat});return}if(t.hasAttribute('data-back')){back();return}
 if(t.hasAttribute('data-fav')){const id=view.id;FAV=FAV.includes(id)?FAV.filter(x=>x!==id):[...FAV,id];store.set('mc_fav',FAV);const on=FAV.includes(id);t.classList.toggle('on',on);t.textContent=on?'★':'☆';return}
 if(t.hasAttribute('data-clear')){CALC[view.id].inputs.forEach(i=>{if(i.id)delete S[i.id]});refreshFields();return}
 const k=t.dataset.k;if(!k||view.t!=='calc')return;const d=CALC[view.id],i=d.inputs.find(x=>x.id===k);
 if(t.dataset.c){S[k]=!rawVals(d)[k]}else{S[k]=t.dataset.v;if(i.apply)Object.assign(S,i.apply(t.dataset.v));if(i.reset)i.reset.forEach(r=>delete S[r])}refreshFields()});
$('#app').addEventListener('input',e=>{if(e.target.id==='q'){S._q=e.target.value;const pos=e.target.selectionStart;$('#app').innerHTML=homeHTML();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
 const k=e.target.dataset.k;if(!k||view.t!=='calc'||CALC[view.id].custom)return;S[k]=e.target.value;if(e.target.tagName==='SELECT'){refreshFields();return}update()});
$('#app').addEventListener('change',e=>{const k=e.target.dataset.k;if(k&&e.target.tagName==='SELECT'&&view.t==='calc'&&!CALC[view.id].custom){S[k]=e.target.value;refreshFields()}});
$('#dock').onclick=()=>{const r=$('#res-card');if(r)r.scrollIntoView({behavior:'smooth',block:'start'})};
function fromHash(){const h=location.hash.slice(1);if(CALC[h])return{t:'calc',id:h};const m=/^cat(\d)$/.exec(h);if(m&&CATS[+m[1]])return{t:'cat',ci:+m[1]};return{t:'home'}}
window.addEventListener('hashchange',()=>{const v=fromHash();if(hashOf(v)!==hashOf(view)){view=v;render()}});
view=fromHash();render();
// オフライン対応（Service Worker）
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
